<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Djigit Tau CRM</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: #f5f1e8;
      color: #171717;
      min-height: 100vh;
    }

    .login {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 24px;
      padding: 35px 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.12);
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: linear-gradient(135deg, #111, #d4af37);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 28px;
      font-weight: 800;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 14px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #c49b25;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 16px;
      margin-top: 24px;
      background: #171717;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #c49b25;
    }

    .error {
      color: #c62828;
      text-align: center;
      margin-top: 15px;
      display: none;
    }

    .dashboard {
      display: none;
      min-height: 100vh;
    }

    header {
      background: #171717;
      color: white;
      padding: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h2 {
      font-size: 21px;
    }

    .logout {
      width: auto;
      margin: 0;
      padding: 10px 16px;
      background: #333;
      font-size: 14px;
    }

    main {
      padding: 24px;
      max-width: 1100px;
      margin: auto;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h1 {
      text-align: left;
      margin-bottom: 6px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .stat {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    .stat span {
      color: #777;
      font-size: 14px;
    }

    .stat strong {
      display: block;
      font-size: 30px;
      margin-top: 8px;
    }

    .clients {
      margin-top: 25px;
      background: white;
      border-radius: 20px;
      padding: 22px;
    }

    .clients h2 {
      margin-bottom: 18px;
    }

    .client {
      padding: 16px 0;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
    }

    .badge {
      color: #96731c;
      font-weight: 700;
    }

    @media(max-width: 650px) {
      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <section class="login" id="login">
    <div class="card">
      <div class="logo">DT</div>

      <h1>Djigit Tau CRM</h1>
      <p class="subtitle">Система управления клиентами</p>

      <label>Номер телефона</label>
      <input
        type="tel"
        id="phone"
        placeholder="+7 700 000 00 00"
      >

      <label>Пароль</label>
      <input
        type="password"
        id="password"
        placeholder="Введите пароль"
      >

      <button onclick="login()">Войти</button>

      <p class="error" id="error">
        Введите номер телефона и пароль
      </p>
    </div>
  </section>


  <!-- DASHBOARD -->
  <section class="dashboard" id="dashboard">

    <header>
      <h2>Djigit Tau CRM</h2>
      <button class="logout" onclick="logout()">Выйти</button>
    </header>

    <main>

      <div class="welcome">
        <h1>Добро пожаловать 👋</h1>
        <p>Панель управления CRM</p>
      </div>

      <div class="stats">

        <div class="stat">
          <span>Клиенты</span>
          <strong>124</strong>
        </div>

        <div class="stat">
          <span>Новые заявки</span>
          <strong>18</strong>
        </div>

        <div class="stat">
          <span>Продажи</span>
          <strong>₸2.4M</strong>
        </div>

      </div>

      <div class="clients">

        <h2>Последние клиенты</h2>

        <div class="client">
          <span>Алихан М.</span>
          <span class="badge">Новый</span>
        </div>

        <div class="client">
          <span>Амина К.</span>
          <span class="badge">Оплата</span>
        </div>

        <div class="client">
          <span>Мадина Р.</span>
          <span class="badge">В работе</span>
        </div>

      </div>

    </main>

  </section>


  <script>
    function login() {
      const phone = document.getElementById("phone").value;
      const password = document.getElementById("password").value;
      const error = document.getElementById("error");

      if (phone.trim() === "" || password.trim() === "") {
        error.style.display = "block";
        return;
      }

      error.style.display = "none";

      document.getElementById("login").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
    }

    function logout() {
      document.getElementById("dashboard").style.display = "none";
      document.getElementById("login").style.display = "flex";

      document.getElementById("phone").value = "";
      document.getElementById("password").value = "";
    }
  </script>

</body>
</html>
